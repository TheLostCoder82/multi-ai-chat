[package]
name = "multi-ai-chat"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebSocket support
tokio-tungstenite = "0.21"

# Identifiers
uuid = { version = "1.6", features = ["v4", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# File system utilities
walkdir = "2.4"

# For document storage
sha2 = "0.10"
hex = "0.4"
